<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Dicturs">
  <title>Dicturs</title>
  <defs>
    <linearGradient id="dicturs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="dicturs-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect width="128" height="128" rx="30" fill="url(#dicturs-bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#dicturs-shine)"/>
  <!-- Voice: a short waveform -->
  <g fill="#fff">
    <rect x="20" y="52" width="10" height="24" rx="5"/>
    <rect x="36" y="36" width="10" height="56" rx="5"/>
    <rect x="52" y="46" width="10" height="36" rx="5"/>
  </g>
  <!-- ...becomes a command: shell prompt and cursor -->
  <path d="M74 44l20 20-20 20" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="96" y="80" width="16" height="8" rx="4" fill="#fff" fill-opacity=".85"/>
</svg>
