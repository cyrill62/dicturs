# Builds the website (www/) and publishes it on GitHub Pages, with install.sh at its root.
# One-time setup: Settings › Pages › Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main, master]
    paths: ["www/**", "install.sh", "assets/logo.svg", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path }}/
          VITE_REPO: ${{ github.repository }}
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Point install.sh at this repository and site
        run: |
          sed -i -e "s#cyrill62/dicturs#${{ github.repository }}#g" \
                 -e "s#https://cyrill62.github.io/dicturs#${{ steps.pages.outputs.base_url }}#g" dist/client/install.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
